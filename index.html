<style>

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;-webkit-text-size-adjust:100%;touch-action:manipulation;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;color:var(--tx);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:1rem;line-height:1.75}

the|maximum child value|largest heuristic|first leaf|minimum child value|3|في Minimax، لاعب MIN يختار …","Alpha-Beta pruning can|change the optimal minimax choice|remove the need for a game tree|guarantee winning every game|avoid examining branches that cannot affect the decision|3|تقليم ألفا-بيتا يمكنه …","A ply in a game tree represents|a search frontier|one move by one player|two full games|a heuristic table|1|الـ ply في شجرة اللعبة يمثل …","Which approach follows the Turing Test?|Acting humanly|Thinking humanly|Thinking rationally|Acting rationally|0|أي نهج يتبع اختبار تورينج؟","The cognitive modelling approach corresponds to|Thinking humanly|Acting humanly|Thinking rationally|Acting rationally|0|نهج النمذجة المعرفية يقابل …","Which environment property asks whether the world changes while the agent is thinking?|Episodic vs. Sequential|Static vs. Dynamic|Discrete vs. Continuous|Known vs. Unknown|1|أي خاصية للبيئة تسأل: هل يتغير العالم أثناء تفكير العميل؟","In an episodic environment, the agent's experience is|divided into independent, unconnected episodes|a coherent sequence in which the world evolves|always continuous|always multi-agent|0|في البيئة المجزّأة (episodic)، خبرة العميل …","A planning agent differs from a reflex agent because it|has a model of the world and formulates a goal|ignores the goal|reacts only to the current percept|never performs actions|0|العميل المخطِّط يختلف عن عميل ردّ الفعل لأنه …","Data-driven (forward chaining) search starts from|the given data toward a goal|the goal toward the data|a random state|the deepest node|0|البحث الموجَّه بالبيانات (forward chaining) يبدأ من …","A state space is represented by the four-tuple|[N, A, S, GD]|[P, E, A, S]|[S, A, G, H]|[X, Y, Z, W]|0|فضاء الحالات يُمثَّل بمجموعة رباعية …","In backtracking, the Dead Ends (DE) list contains|states whose descendants failed to contain a goal|the current path being tried|nodes awaiting evaluation|only the goal state|0|في التراجع، قائمة النهايات المسدودة (DE) تحتوي على …","Bidirectional search reduces the time complexity from O(b^d) to|O(b^(d/2))|O(d)|O(b + d)|O(b^(2d))|0|البحث ثنائي الاتجاه يقلل تعقيد الزمن من O(b^d) إلى …","A* graph search is guaranteed to be optimal when the heuristic is|consistent|negative|random|zero only at the goal|0|بحث A* على الرسم البياني مضمون أن يكون أمثل عندما تكون الدالة الاستدلالية …","Data Mining differs from Machine Learning in that it focuses on|discovering unknown properties in the data|predicting from known properties|controlling robot motors|compiling programs|0|يتميّز التنقيب في البيانات عن تعلّم الآلة بأنه يركز على …","Deep Learning is|a subset of Machine Learning|a superset of AI|unrelated to neural networks|a kind of search tree|0|التعلم العميق هو …","Which is NOT one of the 5 Vs of Big Data?|Velocity|Variety|Veracity|Validation|3|أي مما يلي ليس من الـ 5 Vs للبيانات الضخمة؟","Greedy Best-First Search is not guaranteed to be optimal because it|ignores the cost already paid g(n)|uses g(n) only|expands every node|has h(n)=0|0|البحث الجشع الأفضل أولًا غير مضمون الأمثلية لأنه …","In alpha-beta pruning, the remaining children are pruned when|alpha ≥ beta|alpha < beta|alpha = 0|beta = infinity|0|في تقليم ألفا-بيتا يتم تقليم الأبناء المتبقين عندما …","In alpha-beta pruning, alpha is|MAX's best option on the path to the root|MIN's best option on the path to the root|the total path cost|the depth limit|0|في تقليم ألفا-بيتا، قيمة ألفا هي …","Depth-First Search has low space complexity but|may search well below the solution depth|always finds the shortest path|needs a priority queue|requires a heuristic|0|البحث بالعمق أولًا مساحته قليلة لكنه …"].map(s=>{const p=s.split("|");return{q:p[0],o:p.slice(1,5),a:+p[5],t:p[6]};});
const TF=["The four major AI approaches include thinking humanly and acting rationally.|T|True. Both are among the four approaches.|أساليب الذكاء الاصطناعي الأربعة الرئيسية تشمل التفكير كالبشر والتصرف بعقلانية.|صح. كلاهما من الأساليب الأربعة.","The Turing Test directly proves that a machine is conscious.|F|False. It tests human-like behavior, not consciousness.|اختبار تورينج يثبت مباشرة أن الآلة واعية.|خطأ. هو يختبر السلوك الشبيه بالبشر وليس الوعي.","Strong AI and Weak AI express identical claims.|F|False. They differ in claims about genuine understanding or intelligence.|الذكاء الاصطناعي القوي والضعيف يعبّران عن ادعاءات متطابقة.|خطأ. يختلفان في ادعاءاتهما عن الفهم أو الذكاء الحقيقي.","A rational agent should always choose an action at random.|F|False. It chooses actions expected to maximize performance.|العميل العقلاني يجب أن يختار دائمًا فعلًا عشوائيًا.|خطأ. يختار أفعالًا يُتوقع أن تعظّم الأداء.","Sensors are used to perceive the environment.|T|True. Sensors provide percepts.|المستشعرات تُستخدم لإدراك البيئة.|صح. المستشعرات توفّر المدركات.","The A in PEAS stands for Actuators.|T|True. PEAS = Performance, Environment, Actuators, Sensors.|الحرف A في PEAS يرمز إلى Actuators (المشغّلات).|صح. PEAS = مقياس الأداء، البيئة، المشغّلات، المستشعرات.","A fully observable environment is necessarily deterministic.|F|False. Observability and determinism are different properties.|البيئة القابلة للملاحظة بالكامل حتمية بالضرورة.|خطأ. قابلية الملاحظة والحتمية خاصيتان مختلفتان.","A learning agent may improve from feedback.|T|True. Feedback can improve its behavior.|العميل المتعلم قد يتحسن من التغذية الراجعة.|صح. التغذية الراجعة يمكن أن تحسّن سلوكه.","Volume is one of the 5 Vs of Big Data.|T|True. Volume describes data quantity.|الحجم (Volume) أحد الـ 5 Vs للبيانات الضخمة.|صح. الحجم يصف كمية البيانات.","A search problem must specify a goal test.|T|True. The goal test identifies successful states.|مشكلة البحث يجب أن تحدد اختبار هدف.|صح. اختبار الهدف يحدد الحالات الناجحة.","A search tree can contain multiple nodes representing the same state.|T|True. Different action sequences can reach the same state.|شجرة البحث يمكن أن تحتوي على عدة عقد تمثل نفس الحالة.|صح. تسلسلات أفعال مختلفة قد تصل إلى نفس الحالة.","BFS normally uses a LIFO stack.|F|False. BFS uses a FIFO queue.|BFS يستخدم عادةً مكدّس LIFO.|خطأ. BFS يستخدم طابور FIFO.","DFS always returns the least-cost solution.|F|False. DFS is not generally optimal.|DFS يعيد دائمًا الحل الأقل تكلفة.|خطأ. DFS ليس أمثل بشكل عام.","Iterative deepening repeats depth-limited searches.|T|True. The depth limit increases between iterations.|التعميق التكراري يكرر عمليات بحث محدودة العمق.|صح. حد العمق يزيد بين التكرارات.","UCS expands the frontier node with smallest path cost g(n).|T|True. That is its priority rule.|UCS يوسّع عقدة الحدود ذات أصغر تكلفة مسار g(n).|صح. هذه هي قاعدة الأولوية لديه.","Greedy Best-First Search ranks nodes by g(n)+h(n).|F|False. Greedy uses h(n); A* uses g(n)+h(n).|البحث الجشع الأفضل أولًا يرتّب العقد بـ g(n)+h(n).|خطأ. الجشع يستخدم h(n)؛ أما A* فيستخدم g(n)+h(n).","An admissible heuristic never overestimates the actual minimum remaining cost.|T|True. That is the admissibility condition.|الدالة المقبولة لا تبالغ أبدًا في تقدير أقل تكلفة متبقية فعلية.|صح. هذا هو شرط القبول.","A* with h(n)=0 behaves like UCS.|T|True. Then f(n)=g(n).|A* مع h(n)=0 يتصرف مثل UCS.|صح. حينها f(n)=g(n).","In Minimax, MIN tries to maximize MAX’s utility.|F|False. MIN minimizes MAX’s utility.|في Minimax، لاعب MIN يحاول تعظيم منفعة MAX.|خطأ. MIN يقلل منفعة MAX.","Alpha-Beta pruning can reduce explored nodes without changing the Minimax result.|T|True. Correct pruning preserves the minimax decision.|تقليم ألفا-بيتا يمكنه تقليل العقد المستكشفة دون تغيير نتيجة Minimax.|صح. التقليم الصحيح يحافظ على قرار minimax.","Deep Learning is a subset of Machine Learning.|T|True. DL uses multi-layer neural networks and is part of ML, which is part of AI.|التعلم العميق هو جزء من تعلّم الآلة.|صح. التعلم العميق يستخدم شبكات عصبية متعددة الطبقات وهو جزء من ML الذي هو جزء من الذكاء الاصطناعي.","A reflex agent considers the future consequences of its actions.|F|False. It chooses actions from the current percept only; a planning agent considers consequences.|عميل ردّ الفعل يأخذ في الاعتبار العواقب المستقبلية لأفعاله.|خطأ. يختار أفعاله من المدرَك الحالي فقط؛ أما العميل المخطِّط فيفكر في العواقب.","The Total Turing Test adds computer vision and robotics to the Turing Test.|T|True. It extends the test to physical aspects of human behavior.|اختبار تورينج الكلي يضيف الرؤية الحاسوبية والروبوتات إلى اختبار تورينج.|صح. فهو يوسّع الاختبار ليشمل الجوانب الجسدية للسلوك البشري.","Searle's Chinese Room argument concludes that strong AI is false.|T|True. Following rules without understanding is not a mind.|حجة الغرفة الصينية لسيرل تنتهي إلى أن الذكاء الاصطناعي القوي خاطئ.|صح. اتباع القواعد دون فهم لا يعني وجود عقل.","Data mining focuses on prediction based on known properties learned from training data.|F|False. That describes machine learning; data mining focuses on discovering unknown properties.|التنقيب في البيانات يركز على التنبؤ بناءً على خصائص معروفة تعلّمها من بيانات التدريب.|خطأ. هذا وصف تعلّم الآلة؛ التنقيب يركز على اكتشاف خصائص مجهولة.","In an episodic environment, each decision is independent of previous ones.|T|True. Experience is divided into unconnected episodes.|في البيئة المجزّأة (episodic) كل قرار مستقل عن القرارات السابقة.|صح. الخبرة مقسّمة إلى حلقات غير مترابطة.","In a static environment, the world changes while the agent is thinking.|F|False. That is a dynamic environment.|في البيئة الثابتة يتغير العالم أثناء تفكير العميل.|خطأ. هذه هي البيئة الديناميكية.","BFS has high space complexity, while DFS has low space complexity.|T|True. BFS stores a whole level in the frontier; DFS stores only the current path.|BFS له تعقيد مساحة عالٍ بينما DFS تعقيد مساحته منخفض.|صح. BFS يخزّن مستوى كاملًا في الحدود؛ أما DFS فيخزّن المسار الحالي فقط.","Bidirectional search runs one search from the start and one from the goal.|T|True. Each has complexity O(b^(d/2)).|البحث ثنائي الاتجاه يشغّل بحثًا من البداية وآخر من الهدف.|صح. وتعقيد كل منهما O(b^(d/2)).","A heuristic always guarantees an optimal solution.|F|False. It guides the search well but does not guarantee optimality.|الدالة الاستدلالية (heuristic) تضمن دائمًا حلًا أمثل.|خطأ. هي توجّه البحث جيدًا لكنها لا تضمن الأمثلية.","Hill climbing can get stuck at a local maximum.|T|True. It stops when no child is better than the current state.|تسلّق التل قد يعلق عند قيمة عظمى محلية.|صح. يتوقف عندما لا يوجد ابن أفضل من الحالة الحالية.","A* graph search is optimal if the heuristic is consistent.|T|True. Consistency implies admissibility.|بحث A* على الرسم البياني أمثل إذا كانت الدالة الاستدلالية متسقة.|صح. الاتساق يستلزم القبول.","In alpha-beta pruning, the remaining children are pruned when alpha is greater than or equal to beta.|T|True. α ≥ β means the branch cannot affect the decision.|في تقليم ألفا-بيتا يتم تقليم الأبناء المتبقين عندما تكون ألفا أكبر من أو تساوي بيتا.|صح. α ≥ β تعني أن الفرع لا يؤثر على القرار.","Uniform-Cost Search behaves like BFS when every step has the same cost.|T|True. Then ordering by g(n) is ordering by depth.|بحث التكلفة الموحدة يتصرف مثل BFS عندما تكون تكلفة كل خطوة متساوية.|صح. حينها الترتيب حسب g(n) هو الترتيب حسب العمق.","Known and fully observable describe the same property of an environment.|F|False. Known is about the rules; observable is about what sensors reveal of the state.|«معروف» و«قابل للملاحظة بالكامل» وصفان لنفس الخاصية.|خطأ. «معروف» يخص القواعد؛ و«قابل للملاحظة» يخص ما تكشفه المستشعرات من الحالة."].map(s=>{const p=s.split("|");return{q:p[0],a:p[1]==="T"?"true":"false",e:p[2],t:p[3],te:p[4]};});
const ES=[{"tag": "تعريف", "q": "Define: Artificial Intelligence", "a": "• The science and engineering of making intelligent machines, especially intelligent computer programs (John McCarthy).\n• Its goal is to develop machines that behave as though they were intelligent.\n• Studied through four approaches: thinking humanly, acting humanly, thinking rationally, acting rationally.", "tq": "عرّف: الذكاء الاصطناعي", "ta": "• علم وهندسة صناعة آلات ذكية، وخصوصًا برامج الحاسوب الذكية (جون مكارثي).\n• هدفه تطوير آلات تتصرف كأنها ذكية.\n• يُدرس من خلال أربعة نهج: التفكير كالبشر، التصرف كالبشر، التفكير بعقلانية، التصرف بعقلانية."}, {"tag": "تعريف", "q": "Define: Intelligence", "a": "• The capacity to learn and solve problems (Webster).\n• In particular: the ability to solve novel problems, to act rationally, and to act like humans.\n• McCarthy: the computational part of the ability to achieve goals in the world.", "tq": "عرّف: الذكاء", "ta": "• القدرة على التعلم وحل المشكلات (قاموس Webster).\n• وبالتحديد: القدرة على حل المشكلات الجديدة، والتصرف بعقلانية، والتصرف مثل البشر.\n• عند مكارثي: الجزء الحسابي من القدرة على تحقيق الأهداف في العالم.", "x": 1}, {"tag": "تعريف", "q": "Define: Intelligent Agent", "a": "• An entity that perceives its environment through sensors and acts upon it through actuators to achieve goals.\n• Its actions are appropriate for its goals and circumstances.\n• It is flexible to changing environments and goals, and it learns from experience.\n• It makes appropriate choices given perceptual limitations and limited resources (bounded rationality).", "tq": "عرّف: العميل الذكي", "ta": "• كيان يدرك بيئته من خلال المستشعرات ويؤثر فيها من خلال المشغّلات لتحقيق أهدافه.\n• أفعاله مناسبة لأهدافه وظروفه.\n• مرن مع تغيّر البيئة والأهداف، ويتعلم من الخبرة.\n• يتخذ خيارات مناسبة مع محدودية الإدراك والموارد (العقلانية المحدودة)."}, {"tag": "تعريف", "q": "Define: Rational Agent", "a": "• An agent that acts to optimally achieve its goals (does the right thing).\n• For each possible percept sequence, it selects the action expected to maximize its performance measure, given the evidence from the percept sequence and its built-in knowledge.", "tq": "عرّف: العميل العقلاني", "ta": "• عميل يتصرف لتحقيق أهدافه على النحو الأمثل (يفعل الشيء الصحيح).\n• لكل تسلسل مدركات ممكن، يختار الفعل المتوقع أن يعظّم مقياس أدائه، بناءً على الدلائل من تسلسل المدركات ومعرفته المدمجة."}, {"tag": "تعريف", "q": "Define: PEAS", "a": "• A description of the task environment: Performance measure, Environment, Actuators, Sensors.\n• Example, autonomous taxi:\nP: safe, fast, legal, comfortable trip, maximize profits.\nE: roads, other traffic, pedestrians, customers.\nA: steering wheel, accelerator, brake, signal, horn.\nS: cameras, LIDAR, speedometer, GPS, odometer, engine sensors, keyboard.", "tq": "عرّف: PEAS", "ta": "• وصف لبيئة المهمة: مقياس الأداء (P)، البيئة (E)، المشغّلات (A)، المستشعرات (S).\n• مثال، التاكسي ذاتي القيادة:\nP: رحلة آمنة وسريعة وقانونية ومريحة وتعظيم الأرباح.\nE: الطرق والمرور الآخر والمشاة والزبائن.\nA: المقود والمسرّع والفرامل والإشارة والبوق.\nS: الكاميرات وLIDAR وعداد السرعة وGPS وعداد المسافة وحساسات المحرك ولوحة المفاتيح."}, {"tag": "تعريف", "q": "Define: Performance Measure", "a": "• An objective criterion (utility function) for the success of an agent's behavior.\n• It is what the agent tries to maximize; in practice it must be computed somewhere.", "tq": "عرّف: مقياس الأداء", "ta": "• معيار موضوعي (دالة المنفعة) لنجاح سلوك العميل.\n• هو ما يحاول العميل تعظيمه، وعمليًا لا بد أن يُحسب في مكان ما."}, {"tag": "تعريف", "q": "Define: Learning Agent", "a": "• An agent capable of changing itself given training examples or positive or negative feedback, so that the average utility of its actions grows over time (Ertel).\n• Learning cycle: sense, reason, act, get feedback, learn.", "tq": "عرّف: العميل المتعلم", "ta": "• عميل قادر على تغيير نفسه بناءً على أمثلة التدريب أو التغذية الراجعة الإيجابية أو السلبية، بحيث يزداد متوسط منفعة أفعاله مع الوقت (Ertel).\n• دورة التعلم: استشعار، استدلال، فعل، تغذية راجعة، تعلّم.", "x": 1}, {"tag": "تعريف", "q": "Define: Machine Learning", "a": "• The ability to learn without being explicitly programmed; a subset of AI that enables systems to learn patterns from data.\n• It focuses on prediction based on known properties learned from training data.\n• Main types: supervised, unsupervised, and reinforcement learning.", "tq": "عرّف: تعلّم الآلة", "ta": "• القدرة على التعلم دون برمجة صريحة؛ وهو جزء من الذكاء الاصطناعي يمكّن الأنظمة من تعلّم الأنماط من البيانات.\n• يركز على التنبؤ بناءً على خصائص معروفة تُتعلَّم من بيانات التدريب.\n• أنواعه الرئيسية: التعلم الموجَّه، وغير الموجَّه، والتعلم التعزيزي."}, {"tag": "تعريف", "q": "Define: Data Science", "a": "• The science that uses computer science, statistics, machine learning, visualization and human-computer interaction to collect, clean, integrate, analyze and visualize data in order to create data products.", "tq": "عرّف: علم البيانات", "ta": "• العلم الذي يستخدم علوم الحاسب والإحصاء وتعلّم الآلة والتصوير البصري وتفاعل الإنسان والحاسوب لجمع البيانات وتنظيفها ودمجها وتحليلها وعرضها بهدف إنشاء منتجات بيانات.", "x": 1}, {"tag": "تعريف", "q": "Define: Big Data (the 5 Vs)", "a": "• Very large-scale data, characterized by:\nVolume: the amount of data.\nVelocity: speed of generation and movement.\nVariety: different data types.\nVeracity: trustworthiness and quality.\nValue: useful outcomes from the data.", "tq": "عرّف: البيانات الضخمة (الـ 5 Vs)", "ta": "• بيانات ضخمة جدًا، وتتميز بـ:\nالحجم (Volume): كمية البيانات.\nالسرعة (Velocity): سرعة توليدها وانتقالها.\nالتنوع (Variety): اختلاف أنواع البيانات.\nالموثوقية (Veracity): جودة البيانات ومصداقيتها.\nالقيمة (Value): النتائج المفيدة المستخرجة منها.", "x": 1}, {"tag": "تعريف", "q": "Define: State Space", "a": "• The set of all states reachable from the initial state by any sequence of actions; it is defined by the initial state, actions and transition model.\n• Represented as a directed graph: nodes are states and arcs are actions.\n• Formally a four-tuple [N, A, S, GD]: nodes, arcs, start states, goal states.", "tq": "عرّف: فضاء الحالات", "ta": "• مجموعة كل الحالات التي يمكن الوصول إليها من الحالة الابتدائية بأي تسلسل من الأفعال؛ ويحدده: الحالة الابتدائية والأفعال ونموذج الانتقال.\n• يُمثَّل برسم بياني موجَّه: العقد هي الحالات والأضلاع هي الأفعال.\n• رسميًا هو مجموعة رباعية [N, A, S, GD]: العقد، الأقواس، حالات البداية، حالات الهدف."}, {"tag": "تعريف", "q": "Define: Initial State", "a": "• The state from which the search starts (the root of the search tree).\n• Together with the actions and the transition model it defines the state space.", "tq": "عرّف: الحالة الابتدائية", "ta": "• الحالة التي يبدأ منها البحث (جذر شجرة البحث).\n• ومع الأفعال ونموذج الانتقال تحدد فضاء الحالات."}, {"tag": "تعريف", "q": "Define: Goal Test", "a": "• A test that checks whether a given state satisfies the goal condition.\n• Every search problem must specify one; it identifies the successful (goal) states.", "tq": "عرّف: اختبار الهدف", "ta": "• اختبار يتحقق مما إذا كانت حالة معيّنة تحقق شرط الهدف.\n• يجب أن تحدده كل مشكلة بحث؛ وهو يحدد الحالات الناجحة (حالات الهدف)."}, {"tag": "تعريف", "q": "Define: Search Tree", "a": "• A tree of possible action sequences (plans) rooted at the initial state.\n• Each node records its state, its parent and the path cost; the same state can appear in several nodes.", "tq": "عرّف: شجرة البحث", "ta": "• شجرة من تسلسلات الأفعال (الخطط) الممكنة جذرها الحالة الابتدائية.\n• تسجّل كل عقدة حالتها وأباها وتكلفة المسار؛ وقد تظهر نفس الحالة في عدة عقد."}, {"tag": "تعريف", "q": "Define: Frontier (Fringe)", "a": "• The generated nodes that have not yet been expanded.\n• The search strategy decides which frontier node is expanded next: FIFO queue for BFS, LIFO stack for DFS, priority queue for UCS, greedy and A*.", "tq": "عرّف: الحدود (Frontier / Fringe)", "ta": "• العقد المولَّدة التي لم تُوسَّع بعد.\n• استراتيجية البحث هي التي تحدد أي عقدة حدود تُوسَّع بعد ذلك: طابور FIFO لـ BFS، ومكدّس LIFO لـ DFS، وطابور أولوية لـ UCS والجشع وA*."}, {"tag": "تعريف", "q": "Define: Heuristic and Heuristic Function h(n)", "a": "• Heuristic: a strategy for selectively exploring the search space, using knowledge about the problem to guide the search along lines with a high probability of success. It does not guarantee an optimal solution but often comes close.\n• h(n): an estimate of the cost of the cheapest path from node n to a goal. Examples: number of misplaced tiles, Manhattan distance, straight-line distance.", "tq": "عرّف: الاستدلال (Heuristic) والدالة الاستدلالية h(n)", "ta": "• الاستدلال: استراتيجية لاستكشاف فضاء البحث بانتقائية، تستخدم معرفة عن المشكلة لتوجيه البحث نحو المسارات ذات احتمال النجاح العالي. لا تضمن حلًا أمثل لكنها تقترب منه غالبًا.\n• h(n): تقدير لتكلفة أرخص مسار من العقدة n إلى الهدف. أمثلة: عدد القطع في غير مكانها، مسافة مانهاتن، المسافة المستقيمة."}, {"tag": "تعريف", "q": "Define: Admissible Heuristic", "a": "• A heuristic that never overestimates the true optimal cost from a node to the goal: h(n) ≤ h*(n).\n• Optimistic estimates slow down bad plans but never outweigh true costs, so A* tree search stays optimal.\n• Usually obtained from relaxed problems (e.g. misplaced tiles, Manhattan distance in the 8-puzzle).", "tq": "عرّف: الدالة الاستدلالية المقبولة", "ta": "• دالة استدلالية لا تبالغ أبدًا في تقدير التكلفة المثلى الحقيقية من العقدة إلى الهدف: h(n) ≤ h*(n).\n• التقديرات المتفائلة تُبطئ الخطط السيئة لكنها لا تتجاوز التكلفة الحقيقية، فيبقى A* على الشجرة أمثل.\n• تُشتق عادةً من مشكلات مبسّطة (مثل القطع الخاطئة ومسافة مانهاتن في 8-puzzle)."}, {"tag": "تعريف", "q": "Define: Consistent Heuristic", "a": "• A heuristic satisfying h(n) ≤ c(n, n') + h(n') for every node n and successor n'.\n• Consistency implies admissibility.\n• A* graph search is optimal if the heuristic is consistent. Most natural admissible heuristics (especially from relaxed problems) are consistent.", "tq": "عرّف: الدالة الاستدلالية المتسقة", "ta": "• دالة استدلالية تحقق h(n) ≤ c(n, n') + h(n') لكل عقدة n وخلَفها n'.\n• الاتساق يستلزم القبول.\n• A* على الرسم البياني أمثل إذا كانت الدالة متسقة. ومعظم الدوال المقبولة الطبيعية (خصوصًا من المشكلات المبسّطة) متسقة.", "x": 1}, {"tag": "تعريف", "q": "Define: Backtracking Search", "a": "• A technique for systematically trying all paths through a state space.\n• It starts at the start state and follows a path until it finds the goal (then returns the solution path) or hits a dead end (then backtracks to the most recent unexamined node and continues down another branch).\n• Data structures: State List (SL), the current path; New State List (NSL), nodes awaiting evaluation; Dead Ends (DE), states whose descendants failed to contain a goal.", "tq": "عرّف: البحث بالتراجع (Backtracking)", "ta": "• تقنية لتجربة كل المسارات في فضاء الحالات بشكل منهجي.\n• يبدأ من حالة البداية ويتبع مسارًا حتى يجد الهدف (فيعيد مسار الحل) أو يصل إلى طريق مسدود (فيتراجع إلى أحدث عقدة لم تُفحص ويكمل في فرع آخر).\n• هياكل البيانات: SL المسار الحالي، وNSL العقد التي تنتظر التقييم، وDE الحالات التي فشل أبناؤها في احتواء هدف.", "x": 1}, {"tag": "تعريف", "q": "Define: Hill Climbing", "a": "• A heuristic strategy that goes uphill along the steepest path: it evaluates the children of the current state and selects the best child, until it reaches a state better than all its children.\n• It fails if it stops at a local maximum that is not the goal.\n• It works well only if the evaluation function is informative enough to distinguish local from global maxima.", "tq": "عرّف: تسلّق التل (Hill Climbing)", "ta": "• استراتيجية استدلالية تصعد في أشد المسارات انحدارًا: تقيّم أبناء الحالة الحالية وتختار أفضلهم حتى تصل إلى حالة أفضل من كل أبنائها.\n• تفشل إذا توقفت عند قيمة عظمى محلية ليست الهدف.\n• تعمل جيدًا فقط إذا كانت دالة التقييم كافية للتمييز بين القيمة العظمى المحلية والعامة.", "x": 1}, {"tag": "تعريف", "q": "Define: Minimax", "a": "• A decision procedure for two-player games on a game tree.\n• MAX tries to maximize his chance of winning; MIN tries to minimize MAX's chance.\n• Leaves get values (e.g. 0 or 1, or an evaluation score); MAX parents take the maximum of their children, MIN parents take the minimum; the backed-up values choose the move.", "tq": "عرّف: Minimax", "ta": "• إجراء لاتخاذ القرار في الألعاب ذات اللاعبين على شجرة اللعبة.\n• MAX يحاول تعظيم فرصته في الفوز، وMIN يحاول تقليل فرصة MAX.\n• تُعطى الأوراق قيمًا (مثل 0 أو 1 أو درجة تقييم)؛ يأخذ أب MAX أكبر قيمة لأبنائه، ويأخذ أب MIN أصغر قيمة؛ وتُستخدم القيم المرفوعة لاختيار الحركة."}, {"tag": "تعريف", "q": "Define: Alpha-Beta Pruning", "a": "• An optimization of minimax that returns the same move but evaluates fewer nodes by skipping branches that cannot influence the final decision.\n• α: MAX's best option on the path to the root (never decreases). β: MIN's best option on the path to the root (never increases).\n• Prune the remaining children when α ≥ β.", "tq": "عرّف: تقليم ألفا-بيتا", "ta": "• تحسين لـ minimax يعيد نفس الحركة لكنه يقيّم عقدًا أقل بتخطي الفروع التي لا يمكنها التأثير على القرار النهائي.\n• α: أفضل خيار لـ MAX على المسار إلى الجذر (لا تنقص أبدًا). β: أفضل خيار لـ MIN على المسار إلى الجذر (لا تزيد أبدًا).\n• يُقلَّم باقي الأبناء عندما α ≥ β."}, {"tag": "تعريف", "q": "Define: Reinforcement Learning and Affective Computing", "a": "• Reinforcement learning: a machine learning training method based on rewarding desired behaviors and/or punishing undesired ones (e.g. game AI, policy learning, robot navigation).\n• Affective computing: computing connected to emotion; the study and development of systems that can recognize, interpret, process and simulate human affects (feelings, emotions, mood).", "tq": "عرّف: التعلم التعزيزي والحوسبة العاطفية", "ta": "• التعلم التعزيزي: طريقة تدريب في تعلّم الآلة تقوم على مكافأة السلوك المرغوب و/أو معاقبة السلوك غير المرغوب (مثل ذكاء الألعاب وتعلّم السياسات وتنقل الروبوت).\n• الحوسبة العاطفية: حوسبة مرتبطة بالعاطفة؛ دراسة وتطوير أنظمة تستطيع التعرف على المشاعر والعواطف والمزاج البشري وتفسيرها ومعالجتها ومحاكاتها.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Thinking Humanly vs. Acting Humanly", "a": "• Thinking Humanly (cognitive modelling): builds a precise theory of the mind, expresses it as a program, and checks that the program matches human behavior (actions and timing). Tied to cognitive science and neuroscience.\n• Acting Humanly (Turing Test): the machine must behave so that a human interrogator cannot tell it from a human. It needs natural language processing, knowledge representation, automated reasoning and machine learning.", "tq": "قارن: التفكير كالبشر مقابل التصرف كالبشر", "ta": "• التفكير كالبشر (النمذجة المعرفية): بناء نظرية دقيقة للعقل وصياغتها كبرنامج، ثم التحقق من تطابق البرنامج مع السلوك البشري (الأفعال والتوقيت). مرتبط بعلم الإدراك وعلم الأعصاب.\n• التصرف كالبشر (اختبار تورينج): يجب أن تتصرف الآلة بحيث لا يستطيع المحقّق البشري تمييزها عن إنسان. تحتاج إلى معالجة اللغة الطبيعية وتمثيل المعرفة والاستدلال الآلي وتعلّم الآلة."}, {"tag": "مقارنة", "q": "Compare: Strong AI vs. Weak AI", "a": "• Weak AI hypothesis: we can accurately simulate human intelligence in a computer; the machine acts as if it were intelligent.\n• Strong AI hypothesis: we can create algorithms that achieve real human-level intelligence, with understanding, self-awareness and free will; the machine really has a mind.\n• Searle's Chinese Room argues that symbol manipulation alone is not understanding, so strong AI is false.", "tq": "قارن: الذكاء الاصطناعي القوي مقابل الضعيف", "ta": "• فرضية الضعيف: يمكننا محاكاة الذكاء البشري بدقة في الحاسوب؛ فالآلة تتصرف كأنها ذكية.\n• فرضية القوي: يمكننا ابتكار خوارزميات تحقق ذكاءً بشريًا حقيقيًا بفهم ووعي ذاتي وإرادة حرة؛ فالآلة لها عقل فعلًا.\n• حجة الغرفة الصينية لسيرل ترى أن معالجة الرموز وحدها ليست فهمًا، فالذكاء القوي خاطئ."}, {"tag": "مقارنة", "q": "Compare: Reflex Agent vs. Planning Agent", "a": "• Reflex agent: chooses actions based on the current percept (what it senses right now) and does not consider the future consequences of its actions.\n• Planning agent: decides based on hypothesized consequences of actions; it must have a model of how the world evolves in response to actions, and it must formulate a goal.", "tq": "قارن: عميل ردّ الفعل مقابل العميل المخطِّط", "ta": "• عميل ردّ الفعل: يختار أفعاله بناءً على المدرَك الحالي (ما يستشعره الآن) ولا يأخذ في الاعتبار العواقب المستقبلية لأفعاله.\n• العميل المخطِّط: يقرر بناءً على العواقب المفترضة للأفعال؛ ويجب أن يملك نموذجًا لكيفية تطور العالم استجابةً للأفعال، وأن يصوغ هدفًا."}, {"tag": "مقارنة", "q": "Compare: Fully Observable vs. Partially Observable", "a": "• Fully observable: the sensors give the agent access to the complete state of the environment; all variables are known (e.g. positions of all players in a game on screen).\n• Partially observable: the agent sees only a subset of the variables (e.g. other agents out of sight, limited sensors on a robot).", "tq": "قارن: القابلة للملاحظة بالكامل مقابل الجزئية", "ta": "• قابلة للملاحظة بالكامل: المستشعرات تعطي العميل الحالة الكاملة للبيئة؛ كل المتغيرات معروفة (مثل مواقع كل اللاعبين).\n• قابلة للملاحظة جزئيًا: يرى العميل جزءًا فقط من المتغيرات (مثل عملاء آخرين خارج مجال الرؤية أو مستشعرات محدودة)."}, {"tag": "مقارنة", "q": "Compare: Deterministic vs. Stochastic Environment", "a": "• Deterministic: the next state is completely determined by the current state and the agent's action (unique successor), e.g. chess and checkers.\n• Stochastic: the next state is not fully determined; there is a distribution over possible outcomes, e.g. backgammon and dice games.\n• Strategic: deterministic except for the actions of other agents.", "tq": "قارن: البيئة الحتمية مقابل العشوائية", "ta": "• حتمية: الحالة التالية تتحدد بالكامل بالحالة الحالية وفعل العميل (خلَف وحيد)، مثل الشطرنج والداما.\n• عشوائية: الحالة التالية لا تتحدد بالكامل؛ هناك توزيع على النتائج الممكنة، مثل الطاولة وألعاب النرد.\n• استراتيجية: حتمية باستثناء أفعال العملاء الآخرين."}, {"tag": "مقارنة", "q": "Compare: Episodic vs. Sequential, and Static vs. Dynamic", "a": "• Episodic: experience is divided into independent, unconnected episodes (e.g. classifying one email). Sequential: a coherent sequence in which the world evolves (e.g. Pac-Man, self-driving). Episodic is simpler because no decision affects future ones, so the agent need not think ahead.\n• Static: the environment does not change while the agent thinks (e.g. solving a Rubik's cube). Dynamic: it changes while the agent thinks (e.g. traffic). Semi-dynamic: the environment does not change but the performance score does (e.g. chess with a clock).", "tq": "قارن: المجزّأة مقابل المتسلسلة، والثابتة مقابل الديناميكية", "ta": "• مجزّأة (Episodic): الخبرة مقسّمة إلى حلقات مستقلة غير مترابطة (مثل تصنيف رسالة بريد). متسلسلة (Sequential): تسلسل مترابط يتطور فيه العالم (مثل Pac-Man والقيادة الذاتية). المجزّأة أبسط لأن أي قرار لا يؤثر على القرارات اللاحقة فلا يحتاج العميل للتفكير مسبقًا.\n• ثابتة: لا تتغير البيئة أثناء تفكير العميل (مثل حل مكعب روبيك). ديناميكية: تتغير أثناء تفكيره (مثل المرور). شبه ديناميكية: البيئة لا تتغير لكن درجة الأداء تتغير (مثل الشطرنج مع ساعة).", "x": 1}, {"tag": "مقارنة", "q": "Compare: Machine Learning vs. Data Mining", "a": "• Machine learning focuses on prediction, based on known properties learned from the training data; performance is judged by the ability to reproduce known knowledge.\n• Data mining focuses on the discovery of previously unknown properties in the data; it is the analysis step of Knowledge Discovery in Databases.\n• They often use the same methods and overlap significantly.", "tq": "قارن: تعلّم الآلة مقابل التنقيب في البيانات", "ta": "• تعلّم الآلة يركز على التنبؤ بناءً على خصائص معروفة تُتعلَّم من بيانات التدريب؛ ويُقاس الأداء بالقدرة على إعادة إنتاج المعرفة المعروفة.\n• التنقيب في البيانات يركز على اكتشاف خصائص مجهولة سابقًا في البيانات؛ وهو خطوة التحليل في اكتشاف المعرفة في قواعد البيانات.\n• كثيرًا ما يستخدمان نفس الطرق ويتداخلان كثيرًا.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Machine Learning vs. Deep Learning", "a": "• Machine learning: learning from data without being explicitly programmed. Features are extracted manually using domain knowledge, then a traditional ML algorithm classifies.\n• Deep learning: a subset of machine learning based on multi-layer neural networks; feature extraction and classification are learned together inside the network.\n• Deep learning is a part of ML, which is a part of AI.", "tq": "قارن: تعلّم الآلة مقابل التعلم العميق", "ta": "• تعلّم الآلة: التعلم من البيانات دون برمجة صريحة. تُستخرج الخصائص يدويًا بمعرفة المجال، ثم تصنّف خوارزمية ML تقليدية.\n• التعلم العميق: جزء من تعلّم الآلة قائم على شبكات عصبية متعددة الطبقات؛ يتم تعلّم استخراج الخصائص والتصنيف معًا داخل الشبكة.\n• التعلم العميق جزء من ML، وهو جزء من الذكاء الاصطناعي.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Goal-based Agents vs. Cost-based Agents", "a": "• Goal-based agent: its goal is to reach a goal state, e.g. put every email in the right category.\n• Cost-based agent: its goal is to minimize the cost of erroneous decisions in the long term. Errors of different severity are weighted by a cost factor.\n• Spam filter example: Agent 1 makes fewer errors but loses 11 important emails; Agent 2 makes more errors but loses none, so it may be better when losing wanted mail is costly.", "tq": "قارن: العميل القائم على الهدف مقابل القائم على التكلفة", "ta": "• العميل القائم على الهدف: هدفه الوصول إلى حالة الهدف، مثل وضع كل رسالة في التصنيف الصحيح.\n• العميل القائم على التكلفة: هدفه تقليل تكلفة القرارات الخاطئة على المدى الطويل. وتُوزن الأخطاء المختلفة في خطورتها بمعامل تكلفة.\n• مثال مرشح السبام: العميل 1 يخطئ أقل لكنه يفقد 11 رسالة مهمة؛ والعميل 2 يخطئ أكثر لكنه لا يفقد شيئًا، فقد يكون أفضل عندما يكون فقدان الرسائل المرغوبة مكلفًا.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Data-Driven vs. Goal-Driven Search", "a": "• Data-driven (forward chaining): start from the given data and search toward a goal. Suggested when the data are given in the problem statement, there are few ways to use the facts, there are many potential goals, or it is hard to form a goal.\n• Goal-driven (backward chaining): start from a goal and search back to the facts. Suggested when the goal is given or easily formulated, many rules could produce new facts, or the data are not given but acquired by the problem solver.", "tq": "قارن: البحث الموجَّه بالبيانات مقابل الموجَّه بالهدف", "ta": "• موجَّه بالبيانات (forward chaining): يبدأ من البيانات المعطاة ويبحث نحو الهدف. يناسب عندما تكون البيانات معطاة في نص المسألة، أو توجد طرق قليلة لاستخدام الحقائق، أو أهداف محتملة كثيرة، أو يصعب تكوين هدف.\n• موجَّه بالهدف (backward chaining): يبدأ من الهدف ويبحث رجوعًا إلى الحقائق. يناسب عندما يكون الهدف معطى أو يسهل صياغته، أو توجد قواعد كثيرة تولّد حقائق جديدة، أو لا تكون البيانات معطاة بل يحصل عليها الحلّال.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Blind (Uninformed) vs. Heuristic (Informed) Search", "a": "• Blind (uninformed, exhaustive, brute-force) strategies do not use any information contained in a state: BFS, DFS, depth-limited, iterative deepening, bidirectional, uniform-cost.\n• Heuristic (informed) strategies use that information to judge that one node is more promising than another: greedy best-first, A*, hill climbing, best-first.", "tq": "قارن: البحث الأعمى مقابل البحث الاستدلالي", "ta": "• الأعمى (غير المستنير / الشامل / القوة الغاشمة): لا يستخدم أي معلومات داخل الحالة: BFS وDFS ومحدود العمق والتعميق التكراري وثنائي الاتجاه والتكلفة الموحدة.\n• الاستدلالي (المستنير): يستخدم تلك المعلومات للحكم بأن عقدة أكثر وعدًا من أخرى: الجشع الأفضل أولًا وA* وتسلّق التل والأفضل أولًا.", "x": 1}, {"tag": "مقارنة", "q": "Compare: BFS vs. DFS", "a": "• BFS: new nodes go at the end of the fringe (FIFO queue), so nodes are expanded level by level. It guarantees the shortest solution when step costs are equal, but has high space complexity.\n• DFS: new nodes go at the front of the fringe (LIFO stack), so it dives deep first. It has low space complexity, but may search well below the solution depth and is not guaranteed to find the shortest or cheapest solution.", "tq": "قارن: BFS مقابل DFS", "ta": "• BFS: العقد الجديدة تُضاف في نهاية الحدود (طابور FIFO) فتُوسَّع العقد مستوى بمستوى. يضمن أقصر حل عندما تتساوى تكلفة الخطوات، لكن تعقيد مساحته عالٍ.\n• DFS: العقد الجديدة تُضاف في مقدمة الحدود (مكدّس LIFO) فيغوص في العمق أولًا. مساحته قليلة، لكنه قد يبحث بعيدًا أسفل عمق الحل ولا يضمن أقصر أو أرخص حل."}, {"tag": "مقارنة", "q": "Compare: DFS vs. Iterative Deepening", "a": "• DFS goes deep with a stack, may go well below the solution depth, and does not guarantee the shortest solution.\n• Iterative deepening repeats depth-limited DFS for k = 0, 1, 2, ... (each run has outcome solution, failure, or cutoff). It guarantees the shortest solution like BFS, uses little space like DFS, and has the best performance in orders of complexity.", "tq": "قارن: DFS مقابل التعميق التكراري", "ta": "• DFS يغوص في العمق باستخدام مكدّس، وقد يتجاوز عمق الحل كثيرًا، ولا يضمن أقصر حل.\n• التعميق التكراري يعيد تشغيل DFS محدود العمق لـ k = 0, 1, 2, ... (وتكون نتيجة كل تشغيل: حل أو فشل أو قطع Cutoff). يضمن أقصر حل مثل BFS، ويستهلك مساحة قليلة مثل DFS، وله أفضل أداء من حيث رتبة التعقيد."}, {"tag": "مقارنة", "q": "Compare: BFS vs. Uniform-Cost Search", "a": "• BFS expands by depth (number of steps) using a FIFO queue; it is optimal when every step has the same cost.\n• UCS orders the fringe by the accumulated path cost g(n), expanding the cheapest node first. It finds the least-cost solution when each step costs at least ε > 0.\n• With equal step costs, UCS behaves like BFS.", "tq": "قارن: BFS مقابل بحث التكلفة الموحدة", "ta": "• BFS يوسّع حسب العمق (عدد الخطوات) بطابور FIFO؛ وهو أمثل عندما تتساوى تكلفة كل خطوة.\n• UCS يرتّب الحدود حسب تكلفة المسار المتراكمة g(n) ويوسّع أرخص عقدة أولًا. يجد الحل الأقل تكلفة عندما تكون كل خطوة بتكلفة ≥ ε > 0.\n• عند تساوي تكاليف الخطوات يتصرف UCS مثل BFS."}, {"tag": "مقارنة", "q": "Compare: Greedy Best-First vs. A*", "a": "• Greedy best-first: f(n) = h(n). It follows the node that looks closest to the goal and ignores the cost paid so far, so it is fast but not optimal.\n• A*: f(n) = g(n) + h(n), combining the cost so far and the estimated cost to go. It is optimal with an admissible heuristic (tree search) or a consistent heuristic (graph search).\n• With h(n) = 0, A* becomes UCS.", "tq": "قارن: الجشع الأفضل أولًا مقابل A*", "ta": "• الجشع: f(n) = h(n). يتبع العقدة التي تبدو الأقرب إلى الهدف ويتجاهل التكلفة المدفوعة حتى الآن، فهو سريع لكنه ليس أمثل.\n• A*: f(n) = g(n) + h(n)، فيجمع بين التكلفة المدفوعة والتكلفة المقدّرة المتبقية. وهو أمثل مع دالة مقبولة (على الشجرة) أو متسقة (على الرسم البياني).\n• عندما h(n) = 0 يصبح A* هو UCS."}, {"tag": "مقارنة", "q": "Compare: Tree Search vs. Graph Search", "a": "• Tree search may expand the same state many times when there are repeated states.\n• Graph search adds a closed set of expanded states: before expanding a node it checks that its state was never expanded, otherwise skips it. The closed set should be stored as a set, not a list.\n• A* tree search is optimal with an admissible heuristic; A* graph search needs a consistent heuristic.", "tq": "قارن: البحث على الشجرة مقابل البحث على الرسم البياني", "ta": "• البحث على الشجرة قد يوسّع نفس الحالة مرات عديدة عند وجود حالات مكررة.\n• البحث على الرسم البياني يضيف مجموعة مغلقة (closed set) من الحالات الموسَّعة: قبل توسيع عقدة يتحقق أن حالتها لم تُوسَّع من قبل وإلا تخطّاها. ويُفضَّل تخزين المجموعة المغلقة كمجموعة وليس كقائمة.\n• A* على الشجرة أمثل مع دالة مقبولة؛ وعلى الرسم البياني يحتاج دالة متسقة.", "x": 1}, {"tag": "مقارنة", "q": "Compare: Minimax vs. Alpha-Beta Pruning", "a": "• Minimax backs up values over the whole game tree down to the ply depth, with MAX taking the maximum and MIN the minimum of their children.\n• Alpha-beta gives exactly the same move but prunes branches that cannot influence the final decision (when α ≥ β), so it evaluates fewer nodes.", "tq": "قارن: Minimax مقابل تقليم ألفا-بيتا", "ta": "• Minimax يرفع القيم عبر كل شجرة اللعبة حتى عمق الـ ply، حيث يأخذ MAX الأكبر ويأخذ MIN الأصغر من أبنائه.\n• ألفا-بيتا يعطي نفس الحركة تمامًا لكنه يقلّم الفروع التي لا تؤثر على القرار النهائي (عندما α ≥ β)، فيقيّم عقدًا أقل."}, {"tag": "شرح", "q": "Describe briefly the Turing Test (the imitation game).", "a": "• Proposed by Turing (1950) in \"Computing machinery and intelligence\": \"Can machines think?\" is replaced by \"Can machines behave intelligently?\".\n• A human interrogator asks questions through a terminal to two hidden parties, a human and an AI system. If the interrogator cannot tell from the responses which is the machine, the machine passes.\n• Required capabilities: natural language processing, knowledge representation, automated reasoning, machine learning.", "tq": "صف باختصار اختبار تورينج (لعبة المحاكاة).", "ta": "• اقترحه تورينج (1950) في ورقة «Computing machinery and intelligence»: استُبدل سؤال «هل تفكر الآلات؟» بسؤال «هل تتصرف الآلات بذكاء؟».\n• يطرح محقّق بشري أسئلة عبر طرفية على طرفين مخفيين: إنسان ونظام ذكاء اصطناعي. فإذا لم يستطع المحقّق أن يحدد من الردود أيهما الآلة، تنجح الآلة.\n• القدرات المطلوبة: معالجة اللغة الطبيعية، تمثيل المعرفة، الاستدلال الآلي، تعلّم الآلة.", "x": 1}, {"tag": "شرح", "q": "Describe briefly the Total Turing Test.", "a": "• It extends the Turing Test to include physical aspects of human behavior.\n• Besides the four capabilities of the Turing Test, the machine also needs computer vision (to perceive objects) and robotics (to manipulate objects and move).\n• Example discussed: the BabyX virtual baby, which sees through a camera, listens through a microphone, learns and reacts like a human baby.", "tq": "صف باختصار اختبار تورينج الكلي.", "ta": "• يوسّع اختبار تورينج ليشمل الجوانب الجسدية للسلوك البشري.\n• بالإضافة إلى القدرات الأربع في اختبار تورينج، تحتاج الآلة إلى الرؤية الحاسوبية (لإدراك الأشياء) والروبوتات (للتعامل مع الأشياء والحركة).\n• مثال في المحاضرة: الطفل الافتراضي BabyX الذي يرى بالكاميرا ويسمع بالميكروفون ويتعلم ويتفاعل كطفل حقيقي.", "x": 1}, {"tag": "شرح", "q": "Criticize Turing's criteria for intelligent software. What is Searle's Chinese Room argument?", "a": "• Criticism: the Turing Test measures only behavior, so passing it does not prove understanding or a mind.\n• Chinese Room: a person in a closed room, with a rule book and paper, receives Chinese characters through a slot, follows the program's instructions, and returns Chinese characters. Outsiders think he understands Chinese, but he does not.\n• Searle: following a program step by step (symbol manipulation) gives no understanding or intentionality, so the machine does not think or have a mind. Therefore strong AI is false.", "tq": "انتقد معيار تورينج لذكاء البرمجيات. وما هي حجة الغرفة الصينية لسيرل؟", "ta": "• النقد: اختبار تورينج يقيس السلوك فقط، فالنجاح فيه لا يثبت الفهم أو وجود عقل.\n• الغرفة الصينية: شخص داخل غرفة مغلقة معه كتاب قواعد وأوراق يستقبل رموزًا صينية من فتحة، ويتبع تعليمات البرنامج، ويعيد رموزًا صينية. يظن من بالخارج أنه يفهم الصينية لكنه لا يفهمها.\n• سيرل: اتباع برنامج خطوة بخطوة (معالجة رموز) لا يعطي فهمًا أو قصدية، فالآلة لا تفكر ولا تملك عقلًا. إذن الذكاء الاصطناعي القوي خاطئ.", "x": 1}, {"tag": "شرح", "q": "What are the four approaches to AI according to Russell & Norvig?", "a": "• Thinking humanly: the cognitive modelling approach.\n• Acting humanly: the Turing Test approach.\n• Thinking rationally: the laws-of-thought (logic) approach.\n• Acting rationally: the rational agent approach.", "tq": "ما هي النهج الأربعة للذكاء الاصطناعي حسب Russell و Norvig؟", "ta": "• التفكير كالبشر: نهج النمذجة المعرفية.\n• التصرف كالبشر: نهج اختبار تورينج.\n• التفكير بعقلانية: نهج قوانين التفكير (المنطق).\n• التصرف بعقلانية: نهج العميل العقلاني.", "x": 1}, {"tag": "شرح", "q": "Discuss PEAS and how it is employed to specify a task environment.", "a": "• PEAS describes what the agent is trying to achieve, what it can observe, what it can do, and what it interacts with.\n• P (Performance measure): the function the agent maximizes.\n• E (Environment): the world states the agent operates in.\n• A (Actuators): the actions that change the state.\n• S (Sensors): the observations the agent uses to infer the state.\n• Example, spam filter: P = minimize false positives and false negatives; E = the user's email account and server; A = mark as spam, delete; S = incoming messages and account information.", "tq": "ناقش PEAS وكيف يُستخدم لتحديد بيئة المهمة.", "ta": "• يصف PEAS ما يحاول العميل تحقيقه، وما يستطيع ملاحظته، وما يستطيع فعله، وما يتفاعل معه.\n• P (مقياس الأداء): الدالة التي يعظّمها العميل.\n• E (البيئة): حالات العالم التي يعمل فيها العميل.\n• A (المشغّلات): الأفعال التي تغيّر الحالة.\n• S (المستشعرات): الملاحظات التي يستنتج بها العميل الحالة.\n• مثال مرشح السبام: P = تقليل الإيجابيات والسلبيات الكاذبة؛ E = حساب البريد وخادمه؛ A = تعليم كسبام أو حذف؛ S = الرسائل الواردة ومعلومات الحساب.", "x": 1}, {"tag": "شرح", "q": "What are the basic capacities of an intelligent agent? Illustrate using a diagram.", "a": "• The agent works in a loop with its environment: 1) Sense, 2) Reason, 3) Act, 4) Get feedback, 5) Learn.\n• Inputs to the agent: prior knowledge, past experiences, goals/values and observations (knowledge representation, machine learning).\n• Reasoning and decision theory choose the actions.\n• Perception (NLU, computer vision, speech recognition) feeds the agent; action (NLG, robotics, human-robot interaction) acts on the environment.\n• Diagram: Environment → Sense → Agent (reason) → Act → Environment → Feedback → Learn.", "tq": "ما القدرات الأساسية للعميل الذكي؟ وضّحها بمخطط.", "ta": "• يعمل العميل في حلقة مع بيئته: 1) استشعار، 2) استدلال، 3) فعل، 4) تغذية راجعة، 5) تعلّم.\n• مدخلات العميل: المعرفة السابقة، والخبرات السابقة، والأهداف/القيم، والملاحظات (تمثيل المعرفة وتعلّم الآلة).\n• الاستدلال ونظرية القرار يختاران الأفعال.\n• الإدراك (فهم اللغة، الرؤية الحاسوبية، التعرف على الكلام) يغذّي العميل؛ والفعل (توليد اللغة، الروبوتات، التفاعل بين الإنسان والروبوت) يؤثر في البيئة.\n• المخطط: البيئة ← استشعار ← العميل (استدلال) ← فعل ← البيئة ← تغذية راجعة ← تعلّم.", "x": 1}, {"tag": "شرح", "q": "Characterize the environments: Poker, Medical Diagnosis, Image Analysis, Interactive English Tutor.", "a": "• Poker: partially observable, stochastic, sequential, static, discrete, multi-agent.\n• Medical diagnosis: partially observable, stochastic, sequential, dynamic, continuous, single-agent.\n• Image analysis: fully observable, deterministic, episodic, semi-dynamic, continuous, single-agent.\n• Interactive English tutor: partially observable, stochastic, sequential, dynamic, discrete, multi-agent.\n(Following the Russell & Norvig textbook table.)", "tq": "صنّف البيئات: البوكر، التشخيص الطبي، تحليل الصور، المعلم التفاعلي للإنجليزية.", "ta": "• البوكر: قابلة للملاحظة جزئيًا، عشوائية، متسلسلة، ثابتة، منفصلة، متعددة العملاء.\n• التشخيص الطبي: جزئية الملاحظة، عشوائية، متسلسلة، ديناميكية، مستمرة، عميل واحد.\n• تحليل الصور: قابلة للملاحظة بالكامل، حتمية، مجزّأة، شبه ديناميكية، مستمرة، عميل واحد.\n• المعلم التفاعلي للإنجليزية: جزئية الملاحظة، عشوائية، متسلسلة، ديناميكية، منفصلة، متعددة العملاء.\n(حسب جدول كتاب Russell & Norvig.)", "x": 1}, {"tag": "شرح", "q": "Is the environment of an autonomous taxi driver competitive or cooperative?", "a": "• It is a multi-agent environment that is partially both.\n• Competitive: taxis compete for resources such as parking spaces and passengers.\n• Cooperative: avoiding collisions maximizes the performance measure of all agents.", "tq": "هل بيئة سائق التاكسي الذاتي تنافسية أم تعاونية؟", "ta": "• هي بيئة متعددة العملاء وتجمع بين النوعين جزئيًا.\n• تنافسية: سيارات الأجرة تتنافس على موارد مثل أماكن الانتظار والركاب.\n• تعاونية: تجنّب التصادم يعظّم مقياس الأداء لجميع العملاء.", "x": 1}, {"tag": "شرح", "q": "Is Known vs. Unknown the same distinction as Fully vs. Partially Observable?", "a": "• No.\n• Known vs. unknown is about the rules of the environment (the transition model and rewards): does the agent know the outcomes of its actions?\n• Fully vs. partially observable is about whether the sensors reveal the complete state.\n• A known environment can be partially observable (solitaire: you know the rules but cannot see the face-down cards). An unknown environment can be fully observable (a new video game: you see the whole screen but do not know what the controls do).", "tq": "هل «معروف مقابل مجهول» نفس تمييز «قابلة للملاحظة بالكامل مقابل جزئيًا»؟", "ta": "• لا.\n• معروف/مجهول يخص قواعد البيئة (نموذج الانتقال والمكافآت): هل يعرف العميل نتائج أفعاله؟\n• قابلة للملاحظة بالكامل/جزئيًا تخص ما إذا كانت المستشعرات تكشف الحالة الكاملة.\n• قد تكون البيئة معروفة وجزئية الملاحظة (سوليتير: تعرف القواعد لكن لا ترى الأوراق المقلوبة). وقد تكون مجهولة وكاملة الملاحظة (لعبة فيديو جديدة: ترى الشاشة كلها لكن لا تعرف وظيفة الأزرار).", "x": 1}, {"tag": "شرح", "q": "Explain why communication can emerge as rational behavior in multi-agent environments.", "a": "• In a multi-agent environment, an agent's performance depends on the other agents' actions.\n• Communicating (sharing information, intentions or plans) lets agents coordinate and avoid conflicts, which increases each agent's performance measure.\n• So communication can be the action expected to maximize performance, i.e. rational.", "tq": "اشرح لماذا قد يظهر التواصل كسلوك عقلاني في البيئات متعددة العملاء.", "ta": "• في البيئة متعددة العملاء يعتمد أداء العميل على أفعال العملاء الآخرين.\n• التواصل (تبادل المعلومات أو النوايا أو الخطط) يسمح للعملاء بالتنسيق وتجنب التعارض، مما يرفع مقياس أداء كل منهم.\n• لذا قد يكون التواصل هو الفعل المتوقع أن يعظّم الأداء، أي أنه عقلاني.", "x": 1}, {"tag": "شرح", "q": "Draw a block diagram of a generic supervised machine learning model.", "a": "• Training phase: training data (text, documents, images) → feature vectors; the labels (correct answers) are supplied with them → machine learning algorithm → predictive model.\n• Prediction phase: new data → feature vector → predictive model → expected label (the model's prediction).", "tq": "ارسم مخططًا صندوقيًا لنموذج تعلّم آلة موجَّه عام.", "ta": "• مرحلة التدريب: بيانات التدريب (نصوص، مستندات، صور) ← متجهات الخصائص؛ وتُعطى معها التصنيفات (الإجابات الصحيحة) ← خوارزمية تعلّم الآلة ← النموذج التنبؤي.\n• مرحلة التنبؤ: بيانات جديدة ← متجه الخصائص ← النموذج التنبؤي ← التصنيف المتوقع (تنبؤ النموذج).", "x": 1}, {"tag": "شرح", "q": "Identify the machine learning approach for: life expectancy, customer segmentation, robot navigation, recommender systems, market/weather forecasting, medical image classification.", "a": "• Life expectancy: supervised learning (regression).\n• Customer segmentation: unsupervised learning (clustering).\n• Robot navigation: reinforcement learning.\n• Recommender systems: typically unsupervised (clustering / pattern search); supervised variants also exist.\n• Market / weather forecasting: supervised learning (regression / time-series prediction).\n• Medical image classification: supervised learning (classification).", "tq": "حدّد أسلوب تعلّم الآلة المناسب لـ: متوسط العمر المتوقع، تقسيم العملاء، تنقل الروبوت، أنظمة التوصية، التنبؤ بالأسواق/الطقس، تصنيف الصور الطبية.", "ta": "• متوسط العمر المتوقع: تعلّم موجَّه (انحدار).\n• تقسيم العملاء: تعلّم غير موجَّه (تجميع Clustering).\n• تنقل الروبوت: تعلّم تعزيزي.\n• أنظمة التوصية: غالبًا غير موجَّه (تجميع / بحث عن أنماط)، وتوجد أيضًا نسخ موجَّهة.\n• التنبؤ بالأسواق أو الطقس: تعلّم موجَّه (انحدار / تنبؤ بالسلاسل الزمنية).\n• تصنيف الصور الطبية: تعلّم موجَّه (تصنيف).", "x": 1}, {"tag": "شرح", "q": "What are the components of a search problem? Give the state space of Tic-Tac-Toe and the Traveling Salesperson problem.", "a": "• Search problem: initial state, actions, transition model, goal state (goal test), and path cost. A solution is a sequence of actions from the start to a goal, ideally the optimal one.\n• Tic-Tac-Toe: nodes = all configurations of Xs and Os; arcs = legal moves; start = empty board; goal = three Xs in a row, column or diagonal; the arcs are directed, so the space is a DAG; up to 9! paths.\n• Traveling Salesperson: nodes = cities; arcs weighted by travel cost; start = home city; goal = a complete circuit of minimum cost; complexity (n-1)! paths.", "tq": "ما مكوّنات مشكلة البحث؟ اذكر فضاء الحالات للعبة Tic-Tac-Toe ومشكلة البائع المتجول.", "ta": "• مشكلة البحث: الحالة الابتدائية، الأفعال، نموذج الانتقال، حالة الهدف (اختبار الهدف)، وتكلفة المسار. والحل تسلسل أفعال من البداية إلى الهدف، ويفضّل أن يكون الأمثل.\n• Tic-Tac-Toe: العقد = كل تشكيلات X وO؛ الأقواس = الحركات القانونية؛ البداية = لوحة فارغة؛ الهدف = ثلاث علامات X في صف أو عمود أو قطر؛ الأقواس موجَّهة فالفضاء رسم DAG؛ حتى 9! مسارًا.\n• البائع المتجول: العقد = المدن؛ الأقواس موزونة بتكلفة السفر؛ البداية = مدينة الأصل؛ الهدف = دورة كاملة بأقل تكلفة؛ التعقيد (n-1)! مسارًا.", "x": 1}, {"tag": "شرح", "q": "Why is the misplaced-tiles heuristic admissible for the 8-puzzle? Compare it with Manhattan distance.", "a": "• Misplaced tiles is the solution of a relaxed problem in which a tile can jump to its goal position in one move. Every misplaced tile needs at least one move, so h never overestimates the true cost.\n• Manhattan distance relaxes the puzzle so that any tile can slide in any direction, ignoring other tiles. It is also admissible and dominates misplaced tiles (it is larger but still never exceeds the true cost), so A* expands fewer nodes (average 25 vs. 39 nodes at 8 steps).\n• Using the true cost as h would be admissible and expand the fewest nodes, but computing it costs as much as solving the problem: a trade-off between estimate quality and work per node.", "tq": "لماذا تكون دالة القطع الخاطئة مقبولة في 8-puzzle؟ وقارنها بمسافة مانهاتن.", "ta": "• القطع الخاطئة هي حل لمشكلة مبسّطة تستطيع فيها كل قطعة أن تقفز إلى مكانها في حركة واحدة. كل قطعة خاطئة تحتاج حركة واحدة على الأقل، فلا تبالغ h في التكلفة الحقيقية.\n• مسافة مانهاتن تبسّط اللغز بحيث تنزلق أي قطعة في أي اتجاه متجاهلةً القطع الأخرى. وهي أيضًا مقبولة وتهيمن على القطع الخاطئة (أكبر منها لكنها لا تتجاوز التكلفة الحقيقية)، فيوسّع A* عقدًا أقل (متوسط 25 مقابل 39 عقدة عند 8 خطوات).\n• استخدام التكلفة الحقيقية كـ h مقبول ويوسّع أقل عدد من العقد، لكن حسابه مكلف كحل المشكلة نفسها: موازنة بين جودة التقدير والعمل لكل عقدة.", "x": 1}, {"tag": "شرح", "q": "Explain Alpha-Beta pruning step by step.", "a": "• Explore the game tree depth-first down to the full ply depth.\n• Apply the heuristic evaluation to a state and all its siblings.\n• Back up values as in minimax: a MAX node takes the maximum of its children, a MIN node takes the minimum.\n• Offer this value to the grandparent as β for MIN nodes or α for MAX nodes.\n• α = MAX's best option so far, never decreases; β = MIN's best option so far, never increases.\n• Prune the remaining children when α ≥ β. The result equals minimax.", "tq": "اشرح تقليم ألفا-بيتا خطوة بخطوة.", "ta": "• استكشف شجرة اللعبة بالعمق أولًا حتى عمق الـ ply الكامل.\n• طبّق التقييم الاستدلالي على الحالة وعلى كل إخوتها.\n• ارفع القيم كما في minimax: عقدة MAX تأخذ أكبر قيمة لأبنائها، وعقدة MIN تأخذ أصغر قيمة.\n• قدّم هذه القيمة للجد على أنها β لعقد MIN أو α لعقد MAX.\n• α = أفضل خيار لـ MAX حتى الآن ولا تنقص أبدًا؛ β = أفضل خيار لـ MIN حتى الآن ولا تزيد أبدًا.\n• قلّم باقي الأبناء عندما α ≥ β. والنتيجة تساوي نتيجة minimax.", "x": 1}, {"tag": "مسألة بحث", "q": "Problem 1 — BFS (Graph Search)\nStart S; Goal G. Directed edges in listed successor order: S->A, S->B, A->C, A->D, B->E, C->G, D->G, E->G. Assume FIFO and mark states visited when enqueued. Find expansion order, final path, and number of edges.", "a": "Frontier trace (FIFO):\nS → expand S: add A, B\nA → expand: add C, D\nB → expand: add E\nC → expand: add G\nD, E → expanded (G already enqueued)\nG → goal.\nExpansion / visit order: S, A, B, C, D, E, G\nFinal answer: S -> A -> C -> G; 3 edges (shallowest goal).", "tq": "مسألة 1 — BFS (بحث في الرسم البياني)\nالبداية S؛ الهدف G. الأضلاع الموجَّهة بترتيب الخلفاء المذكور: S->A, S->B, A->C, A->D, B->E, C->G, D->G, E->G. افترض طابور FIFO وعلّم الحالات كمزارة عند إضافتها للطابور. أوجد ترتيب التوسيع والمسار النهائي وعدد الأضلاع.", "ta": "تتبّع الحدود (FIFO):\nS ← نوسّع S: نضيف A وB\nA ← نوسّع: نضيف C وD\nB ← نوسّع: نضيف E\nC ← نوسّع: نضيف G\nD وE ← يُوسَّعان (G مضافة بالفعل)\nG ← الهدف.\nترتيب التوسيع/الزيارة: S, A, B, C, D, E, G\nالإجابة النهائية: S -> A -> C -> G؛ 3 أضلاع (أقرب هدف)."}, {"tag": "مسألة بحث", "q": "Problem 2 — DFS (Graph Search)\nStart S; Goal G. Directed edges in listed successor order: S->A, S->B, A->C, A->D, B->E, C->G, D->G, E->G. Explore successors left-to-right (A before B, C before D), avoid revisits. Find visitation order and path.", "a": "Stack trace (LIFO):\nS → push A, B (A on top)\nA → push C, D (C on top)\nC → push G\nG → goal.\nVisit order: S, A, C, G\nFinal answer: S -> A -> C -> G.", "tq": "مسألة 2 — DFS (بحث في الرسم البياني)\nالبداية S؛ الهدف G. الأضلاع الموجَّهة بترتيب الخلفاء المذكور: S->A, S->B, A->C, A->D, B->E, C->G, D->G, E->G. استكشف الخلفاء من اليسار لليمين (A قبل B، وC قبل D)، وتجنّب إعادة الزيارة. أوجد ترتيب الزيارة والمسار.", "ta": "تتبّع المكدّس (LIFO):\nS ← ندفع A وB (A في القمة)\nA ← ندفع C وD (C في القمة)\nC ← ندفع G\nG ← الهدف.\nترتيب الزيارة: S, A, C, G\nالإجابة النهائية: S -> A -> C -> G."}, {"tag": "مسألة بحث", "q": "Problem 3 — Depth-Limited / Iterative Deepening\nStart S; Goal G. Directed edges: S->A, S->B, A->C, B->D, C->G, D->G. Successors left-to-right. (a) Does DLS at limit 2 reach G? (b) What is the first successful IDDFS limit and path?", "a": "(a) DLS with limit 2 explores S (depth 0), A and B (depth 1), C and D (depth 2). G is at depth 3, so it is not reached: result is cutoff (no goal).\n(b) IDDFS repeats DLS for limits 0, 1, 2, 3: limits 0, 1, 2 fail (cutoff); limit 3 reaches G.\nFinal answer: first success at limit (depth) 3, path S -> A -> C -> G.", "tq": "مسألة 3 — محدود العمق / التعميق التكراري\nالبداية S؛ الهدف G. الأضلاع الموجَّهة: S->A, S->B, A->C, B->D, C->G, D->G. الخلفاء من اليسار لليمين. (أ) هل يصل DLS بحد 2 إلى G؟ (ب) ما أول حد ناجح في IDDFS وما المسار؟", "ta": "(أ) DLS بحد 2 يستكشف S (عمق 0)، وA وB (عمق 1)، وC وD (عمق 2). و G على عمق 3 فلا يصل إليها: النتيجة قطع Cutoff (لا هدف).\n(ب) IDDFS يكرر DLS بحدود 0 و1 و2 و3: الحدود 0 و1 و2 تفشل (قطع)؛ والحد 3 يصل إلى G.\nالإجابة النهائية: أول نجاح عند الحد (العمق) 3، والمسار S -> A -> C -> G."}, {"tag": "مسألة بحث", "q": "Problem 4 — Uniform-Cost Search\nStart S; Goal G. Directed weighted edges: S->A (2), S->B (5), A->C (2), A->G (9), B->G (2), C->G (2). Use graph search, update cheaper frontier paths, stop when goal is popped. Find expansion order, optimal path and total cost.", "a": "Frontier ordered by g(n):\n(S0) → expand S: (A2, B5)\nExpand A: add C4, G11 → (C4, B5, G11)\nExpand C: G via C costs 6, cheaper than 11 → (B5, G6)\nExpand B: G via B costs 7, not cheaper → (G6)\nPop G (cost 6) → stop.\nExpansion order: S, A, C, B, G (B cost 5, G cost 6)\nFinal answer: S -> A -> C -> G; cost 6.", "tq": "مسألة 4 — بحث التكلفة الموحدة\nالبداية S؛ الهدف G. الأضلاع الموجَّهة ذات الأوزان: S->A (2), S->B (5), A->C (2), A->G (9), B->G (2), C->G (2). استخدم البحث في الرسم البياني، وحدّث المسارات الأرخص في الحدود، وتوقف عندما يُستخرج الهدف من الطابور. أوجد ترتيب التوسيع والمسار الأمثل والتكلفة الكلية.", "ta": "الحدود مرتبة حسب g(n):\n(S0) ← نوسّع S: (A2, B5)\nنوسّع A: نضيف C4 وG11 ← (C4, B5, G11)\nنوسّع C: الوصول إلى G عبر C بتكلفة 6 وهي أرخص من 11 ← (B5, G6)\nنوسّع B: الوصول إلى G عبر B بتكلفة 7 وليست أرخص ← (G6)\nنُخرج G (تكلفة 6) ← نتوقف.\nترتيب التوسيع: S, A, C, B, G (تكلفة B تساوي 5 وتكلفة G تساوي 6)\nالإجابة النهائية: S -> A -> C -> G؛ التكلفة 6."}, {"tag": "مسألة بحث", "q": "Problem 7 — Uniform-Cost Search (lecture example)\nStart S; edges S->A (1), S->B (5), S->C (15), A->G (10), B->G (5). Show the node list and the solution found.", "a": "Node list (cost):\n(S0)\n(A1, B5, C15) after expanding S\n(B5, G11, C15) after expanding A (G via A = 1 + 10 = 11)\n(G10, G11, C15) after expanding B (G via B = 5 + 5 = 10)\nThe cheapest node G10 is popped first.\nFinal answer: S -> B -> G; cost 10 (not the path through A, which costs 11).", "tq": "مسألة 7 — بحث التكلفة الموحدة (مثال المحاضرة)\nالبداية S؛ الأضلاع S->A (1), S->B (5), S->C (15), A->G (10), B->G (5). أوضح قائمة العقد والحل الذي نجده.", "ta": "قائمة العقد (التكلفة):\n(S0)\n(A1, B5, C15) بعد توسيع S\n(B5, G11, C15) بعد توسيع A (الوصول إلى G عبر A = 1 + 10 = 11)\n(G10, G11, C15) بعد توسيع B (الوصول إلى G عبر B = 5 + 5 = 10)\nتُخرج أرخص عقدة G10 أولًا.\nالإجابة النهائية: S -> B -> G؛ التكلفة 10 (وليس المسار عبر A الذي تكلفته 11).", "x": 1}, {"tag": "مسألة بحث", "q": "Problem 5 — Greedy Best-First Search\nStart S; Goal G. Edges: S->A (2), S->B (1), A->G (2), B->C (1), C->G (8). Heuristics: h(S)=3, h(A)=2, h(B)=1, h(C)=1, h(G)=0. Break ties alphabetically. Find expansion order, path and cost.", "a": "Greedy orders the frontier by h(n) only:\nExpand S: A (h=2), B (h=1) → pick B\nExpand B: C (h=1) → frontier A (2), C (1) → pick C\nExpand C: G (h=0) → pick G → goal.\nExpansion order: S, B, C, G\nFinal answer: S -> B -> C -> G; cost 1 + 1 + 8 = 10 (not optimal; S -> A -> G costs only 4).", "tq": "مسألة 5 — البحث الجشع الأفضل أولًا\nالبداية S؛ الهدف G. الأضلاع: S->A (2), S->B (1), A->G (2), B->C (1), C->G (8). الدوال الاستدلالية: h(S)=3, h(A)=2, h(B)=1, h(C)=1, h(G)=0. اكسر التعادلات أبجديًا. أوجد ترتيب التوسيع والمسار والتكلفة.", "ta": "الجشع يرتّب الحدود حسب h(n) فقط:\nنوسّع S: A (h=2)، B (h=1) ← نختار B\nنوسّع B: C (h=1) ← الحدود A (2)، C (1) ← نختار C\nنوسّع C: G (h=0) ← نختار G ← الهدف.\nترتيب التوسيع: S, B, C, G\nالإجابة النهائية: S -> B -> C -> G؛ التكلفة 1 + 1 + 8 = 10 (ليست مثلى؛ فالمسار S -> A -> G تكلفته 4 فقط)."}, {"tag": "مسألة بحث", "q": "Problem 6 — A* Search\nStart S; Goal G. Edges: S->A (2), S->B (4), A->C (2), A->G (9), B->G (4), C->G (2). Heuristics: h(S)=5, h(A)=4, h(B)=3, h(C)=2, h(G)=0. Break equal f by alphabetical node name; update cheaper frontier paths. Compute f=g+h, expansion order, path and cost.", "a": "f(n) = g(n) + h(n):\nExpand S (f=5): A: g=2, f=6; B: g=4, f=7\nExpand A (f=6): C: g=4, f=6; G: g=11, f=11\nExpand C (f=6): G via C: g=6, f=6 (replaces f=11)\nFrontier: G (f=6), B (f=7) → pop G → goal.\nExpansion order: S (f5), A (f6), C (f6), G (f6)\nFinal answer: S -> A -> C -> G; cost 6.", "tq": "مسألة 6 — بحث A*\nالبداية S؛ الهدف G. الأضلاع: S->A (2), S->B (4), A->C (2), A->G (9), B->G (4), C->G (2). الدوال الاستدلالية: h(S)=5, h(A)=4, h(B)=3, h(C)=2, h(G)=0. اكسر تعادل f حسب اسم العقدة أبجديًا؛ وحدّث المسارات الأرخص في الحدود. احسب f=g+h وترتيب التوسيع والمسار والتكلفة.", "ta": "f(n) = g(n) + h(n):\nنوسّع S (f=5): A: g=2, f=6؛ B: g=4, f=7\nنوسّع A (f=6): C: g=4, f=6؛ G: g=11, f=11\nنوسّع C (f=6): G عبر C: g=6, f=6 (تحل محل f=11)\nالحدود: G (f=6)، B (f=7) ← نُخرج G ← الهدف.\nترتيب التوسيع: S (f=5), A (f=6), C (f=6), G (f=6)\nالإجابة النهائية: S -> A -> C -> G؛ التكلفة 6."}, {"tag": "مسألة بحث", "q": "Problem 8 — Minimax\nGame tree: MAX root with three MIN children. Left MIN has MAX children with leaf values (2, 3) and (5, 9); middle MIN has MAX children with leaves (0) and (7, 4); right MIN has MAX children with leaves (2, 1) and (5, 6). Compute the minimax value of the root and MAX's best move.", "a": "Bottom MAX nodes take the maximum of their leaves:\nLeft MIN: max(2,3) = 3, max(5,9) = 9\nMiddle MIN: max(0) = 0, max(7,4) = 7\nRight MIN: max(2,1) = 2, max(5,6) = 6\nMIN nodes take the minimum:\nLeft = min(3,9) = 3; Middle = min(0,7) = 0; Right = min(2,6) = 2\nRoot MAX takes the maximum: max(3, 0, 2) = 3.\nFinal answer: root value 3; MAX should choose the left move.", "tq": "مسألة 8 — Minimax\nشجرة لعبة: جذر MAX وله ثلاثة أبناء MIN. أول MIN له ابنان MAX أوراقهما (2, 3) و(5, 9)؛ والأوسط له ابنان MAX أوراقهما (0) و(7, 4)؛ والأخير له ابنان MAX أوراقهما (2, 1) و(5, 6). احسب قيمة minimax للجذر وأفضل حركة لـ MAX.", "ta": "عقد MAX السفلية تأخذ أكبر قيمة لأوراقها:\nMIN الأيسر: max(2,3) = 3، max(5,9) = 9\nMIN الأوسط: max(0) = 0، max(7,4) = 7\nMIN الأيمن: max(2,1) = 2، max(5,6) = 6\nعقد MIN تأخذ الأصغر:\nالأيسر = min(3,9) = 3؛ الأوسط = min(0,7) = 0؛ الأيمن = min(2,6) = 2\nجذر MAX يأخذ الأكبر: max(3, 0, 2) = 3.\nالإجابة النهائية: قيمة الجذر 3؛ وعلى MAX اختيار الحركة اليسرى.", "x": 1}, {"tag": "مسألة بحث", "q": "Problem 9 — Alpha-Beta Pruning\nMAX root with three MIN children. Leaves from left to right: (4, 3), (6, 2), (2, 1), (9, 5), (3, 1), (5, 4), (7, 5). Each pair is the leaf pair of a MAX node: MAX nodes 1-2 under the left MIN, MAX nodes 3-4-5 under the middle MIN, MAX nodes 6-7 under the right MIN. Evaluate left to right with alpha-beta. Which leaves are pruned and what is the root value?", "a": "Left MIN: first MAX = max(4,3) = 4, so MIN ≤ 4. Second MAX sees 6 ≥ 4 = β, so the leaf 2 is pruned; the MAX node is ≥ 6, so MIN = 4. Root α = 4.\nMiddle MIN: first MAX = max(2,1) = 2, so MIN ≤ 2. Since β = 2 ≤ α = 4, the other two MAX subtrees (9,5) and (3,1) are pruned.\nRight MIN: first MAX = max(5,4) = 5, so MIN ≤ 5. Second MAX sees 7 ≥ 5 = β, so the leaf 5 is pruned. MIN = 5. Root α = max(4, 5) = 5.\nFinal answer: root value 5 (MAX picks the right branch); only 8 of 14 leaves are evaluated.", "tq": "مسألة 9 — تقليم ألفا-بيتا\nجذر MAX وله ثلاثة أبناء MIN. الأوراق من اليسار لليمين: (4, 3), (6, 2), (2, 1), (9, 5), (3, 1), (5, 4), (7, 5). كل زوج هو أوراق عقدة MAX: عقدتا MAX 1-2 تحت MIN الأيسر، وعقد MAX 3-4-5 تحت MIN الأوسط، وعقدتا MAX 6-7 تحت MIN الأيمن. قيّم من اليسار لليمين بألفا-بيتا. ما الأوراق المقلَّمة وما قيمة الجذر؟", "ta": "MIN الأيسر: أول MAX = max(4,3) = 4 فيكون MIN ≤ 4. ثاني MAX يجد 6 ≥ 4 = β فتُقلَّم الورقة 2؛ وعقدة MAX ≥ 6 فيصبح MIN = 4. وألفا للجذر = 4.\nMIN الأوسط: أول MAX = max(2,1) = 2 فيكون MIN ≤ 2. وبما أن β = 2 ≤ α = 4 يُقلَّم فرعا MAX الآخران (9,5) و(3,1).\nMIN الأيمن: أول MAX = max(5,4) = 5 فيكون MIN ≤ 5. ثاني MAX يجد 7 ≥ 5 = β فتُقلَّم الورقة 5. فيصبح MIN = 5. وألفا للجذر = max(4, 5) = 5.\nالإجابة النهائية: قيمة الجذر 5 (يختار MAX الفرع الأيمن)؛ وتم تقييم 8 أوراق فقط من 14.", "x": 1}, {"tag": "مسألة بحث", "q": "Problem 10 — Formalize as state-space search: the Missionaries and Cannibals problem\nThree missionaries and three cannibals must cross a river by a boat holding one or two persons. If cannibals ever outnumber missionaries on a bank (with missionaries present), the missionaries are eaten. Give the state representation, initial and goal states, operators, and the first two levels of the state space graph.", "a": "• State: (M, C, B) = missionaries and cannibals on the left bank, and the boat side (L or R).\n• Initial state: (3, 3, L). Goal state: (0, 0, R).\n• Operators: the boat carries (1M), (2M), (1C), (2C) or (1M+1C) from its current side to the other; allowed only if, afterwards, on each bank missionaries are not outnumbered by cannibals (or there are no missionaries there).\n• Level 1 from (3,3,L): (3,2,R), (3,1,R), (2,2,R). [(2,3,R) and (1,3,R) are illegal.]\n• Level 2: from (3,2,R) → (3,3,L); from (3,1,R) → (3,2,L), (3,3,L); from (2,2,R) → (3,2,L), (3,3,L).", "tq": "مسألة 10 — صِغ كبحث في فضاء الحالات: مسألة المبشرين وآكلي لحوم البشر\nثلاثة مبشرين وثلاثة من آكلي لحوم البشر يجب أن يعبروا نهرًا بقارب يتسع لشخص أو اثنين. إذا زاد عدد الآكلين على المبشرين في أي ضفة (مع وجود مبشرين) يُؤكل المبشرون. أعطِ تمثيل الحالة والحالتين الابتدائية والنهائية والعوامل وأول مستويين من الرسم.", "ta": "• الحالة: (M, C, B) = عدد المبشرين والآكلين على الضفة اليسرى، وجهة القارب (L أو R).\n• الحالة الابتدائية: (3, 3, L). الحالة النهائية: (0, 0, R).\n• العوامل: ينقل القارب (مبشر)، (مبشرين)، (آكل)، (آكلين) أو (مبشر + آكل) من جهته الحالية إلى الجهة الأخرى؛ ولا يُسمح إلا إذا لم يزد الآكلون بعدها على المبشرين في أي ضفة (أو لم يوجد مبشرون فيها).\n• المستوى 1 من (3,3,L): (3,2,R) و(3,1,R) و(2,2,R). [الحالتان (2,3,R) و(1,3,R) غير قانونيتين.]\n• المستوى 2: من (3,2,R) ← (3,3,L)؛ ومن (3,1,R) ← (3,2,L) و(3,3,L)؛ ومن (2,2,R) ← (3,2,L) و(3,3,L).", "x": 1}, {"tag": "مسألة بحث", "q": "Problem 11 — Formalize as state-space search: the Farmer, Dog, Rabbit and Lettuce problem\nThe farmer, dog, rabbit and lettuce are on the east bank. The boat holds the farmer and at most one other item. The dog eats the rabbit and the rabbit eats the lettuce if left alone together. Give the state, initial/goal states, operators, and the first two levels.", "a": "• State: (F, D, R, L) = the bank (E or W) of the farmer, dog, rabbit and lettuce.\n• Initial: (E, E, E, E). Goal: (W, W, W, W).\n• Operators: the farmer crosses alone or with one item that is on his bank; the move is illegal if it leaves the dog with the rabbit, or the rabbit with the lettuce, without the farmer.\n• Level 1: only one legal move, take the rabbit → (W, E, W, E). [Taking the dog leaves rabbit+lettuce; taking the lettuce leaves dog+rabbit; going alone leaves both pairs.]\n• Level 2: the farmer returns alone → (E, E, W, E), or returns with the rabbit → back to (E, E, E, E).", "tq": "مسألة 11 — صِغ كبحث في فضاء الحالات: المزارع والكلب والأرنب والخس\nالمزارع والكلب والأرنب والخس على الضفة الشرقية. يتسع القارب للمزارع وعنصر واحد على الأكثر. يأكل الكلب الأرنب ويأكل الأرنب الخس إذا تُركا وحدهما. أعطِ الحالة والحالتين الابتدائية والنهائية والعوامل وأول مستويين.", "ta": "• الحالة: (F, D, R, L) = ضفة (E أو W) المزارع والكلب والأرنب والخس.\n• الابتدائية: (E, E, E, E). النهائية: (W, W, W, W).\n• العوامل: يعبر المزارع وحده أو مع عنصر واحد موجود على ضفته؛ وتكون الحركة غير قانونية إذا تركت الكلب مع الأرنب أو الأرنب مع الخس دون المزارع.\n• المستوى 1: حركة قانونية واحدة فقط وهي نقل الأرنب ← (W, E, W, E). [نقل الكلب يترك الأرنب مع الخس؛ ونقل الخس يترك الكلب مع الأرنب؛ والعبور وحده يترك الزوجين.]\n• المستوى 2: يعود المزارع وحده ← (E, E, W, E)، أو يعود مع الأرنب ← يرجع إلى (E, E, E, E).", "x": 1}];

MC.forEach((q,i)=>{if(i>=50)q.x=1});TF.forEach((q,i)=>{if(i>=20)q.x=1});
const POOL={mcq:MC,tf:TF,essay:ES},n0=a=>a.filter(x=>!x.x).length,nx=a=>a.length-n0(a);
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=s=>document.querySelector(s),app=$("#app"),bub=$("#bub");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const W=t=>t.split(/(\s+)/).map(x=>/^\s*$/.test(x)?x:'<span class="w" data-w="'+esc(x).replace(/"/g,"&quot;")+'">'+esc(x)+"</span>").join("");
const AR=t=>esc(t).replace(/[A-Za-z0-9(][A-Za-z0-9()\->=+*,.→ ]*[A-Za-z0-9)*]|[A-Za-z0-9]/g,m=>'<bdi dir="ltr">'+m+"</bdi>");
let bt;function say(w){const k=norm(w),m=look(k);bub.innerHTML=m?"<b>"+esc(w.replace(/[,;:.?]+$/,""))+"</b> = "+esc(m):"<b>"+esc(w)+"</b> — مفيش ترجمة جاهزة للكلمة دي";bub.classList.add("show");clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove("show"),6000);}
document.addEventListener("click",e=>{const w=e.target.closest(".w");if(w){document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));w.classList.add("on");say(w.dataset.w);}else bub.classList.remove("show");});
let S={};
function row(m,n,t,d){return '<button class="hc" data-go="'+m+'"><div class="n">'+n+'</div><div><b>'+t+'</b><span>'+d+'</span></div></button>';}
function home(){S={m:null,i:0,sc:0,done:false,st:0,tq:false,ta:false,pick:-1};app.innerHTML='<header class="hd"><svg viewBox="0 0 340 100" aria-hidden="true"><g class="e"><line x1="30" y1="50" x2="110" y2="24"/><line x1="30" y1="50" x2="110" y2="78"/><line x1="110" y1="78" x2="310" y2="50"/></g><path class="p" d="M30 50 L110 24 L205 24 L310 50"/><g><g class="on"><circle cx="30" cy="50" r="16"/><text x="30" y="50">S</text></g><g class="on"><circle cx="110" cy="24" r="16"/><text x="110" y="24">A</text></g><g><circle cx="110" cy="78" r="16"/><text x="110" y="78">B</text></g><g class="on"><circle cx="205" cy="24" r="16"/><text x="205" y="24">C</text></g><g class="on"><circle cx="310" cy="50" r="16"/><text x="310" y="50">G</text></g></g></svg><h1>امتحان CF321</h1><p class="sub">شيت 7 — الذكاء الاصطناعي والبحث. اضغط على أي كلمة إنجليزي علشان تشوف معناها.</p></header><nav class="rows">'+row("mcq",n0(MC),"اختيار من متعدد","أسئلة الشيت أولًا، وبعدها 'المزيد' ("+nx(MC)+" إضافي)")+row("tf",n0(TF),"صح أو خطأ","أسئلة الشيت أولًا، وبعدها 'المزيد' ("+nx(TF)+" إضافي)")+row("essay",n0(ES),"المقالي","أسئلة الشيت أولًا، وبعدها 'المزيد' ("+nx(ES)+" إضافي)")+'</nav>';}
function head(len,name){return '<div class="top"><button class="sm" data-act="home">الرئيسية</button><div class="pg"><b>'+(S.i+1)+'</b> / '+len+'<small>'+name+'</small></div><button class="sm" data-act="restart">ابدأ من جديد</button></div><div class="trk"><i style="width:'+(S.i/len*100)+'%"></i><b style="inset-inline-start:'+(S.i/len*100)+'%"></b></div>';}
function canMore(){return !S.more&&nx(POOL[S.m])>0;}
function endScreen(len,name,noscore){app.innerHTML=head(len,name).replace(/<div class="pg">.*?<\/div>/,'<div class="pg"><b>انتهيت</b></div>')+'<div class="card">'+(noscore?"":'<div class="sc">'+S.sc+" / "+len+"</div>")+'<p style="text-align:center">'+(canMore()?'خلصت أسئلة الشيت في قسم '+name+'. فيه '+nx(POOL[S.m])+' سؤال إضافي من المحاضرات.':'خلصت قسم '+name+'.')+'</p><div class="acts" style="justify-content:center">'+(canMore()?'<button class="btn" data-act="more">المزيد من الأسئلة</button>':'')+'<button class="btn'+(canMore()?' alt':'')+'" data-act="restart">ابدأ من جديد</button><button class="btn alt" data-act="home">الرئيسية</button></div></div>';}
function mcq(){const A=S.q,L=A.length;if(S.i>=L)return endScreen(L,"MCQ");const q=A[S.i],d=S.done;let h=head(L,"MCQ"+(q.x?" · إضافي":""))+'<div class="card"><div class="en">'+W(q.q)+"</div>";q.o.forEach((o,j)=>{let c="opt";if(d){c+=" dis";if(j===q.a)c+=" ok";else if(j===S.pick)c+=" no";}h+='<div class="'+c+'" data-pick="'+j+'"><button class="ch">'+"abcd"[j]+'</button><div class="tx en">'+W(o)+"</div></div>";});if(!d)h+='<p class="hint">المس الاختيار علشان تجاوب، والمس أي كلمة إنجليزي علشان تترجمها.</p>';else{const ok=S.pick===q.a;h+='<div class="tr"><b>ترجمة السؤال:</b><br>'+AR(q.t)+'</div><div class="res '+(ok?"ok":"no")+'">'+(ok?"إجابتك صح ✓":"إجابتك غلط ✗ — الصح: "+"abcd"[q.a]+") "+esc(q.o[q.a]))+'</div><div class="acts nx"><button class="btn" data-act="next">التالي</button></div>';}app.innerHTML=h+"</div>";}
function tf(){const A=S.q,L=A.length;if(S.i>=L)return endScreen(L,"True / False");const q=A[S.i],d=S.done;let h=head(L,"True / False"+(q.x?" · إضافي":""))+'<div class="card"><div class="en">'+W(q.q)+'</div><div class="tf">';["true","false"].forEach(v=>{let c="tfb "+(v==="true"?"t":"f");if(d){c+=" dis";if(v===q.a)c+=" ok";else if(v===S.pick)c+=" no";}h+='<button class="'+c+'" data-tf="'+v+'">'+(v==="true"?"True":"False")+"<small>"+(v==="true"?"صح":"خطأ")+"</small></button>";});h+="</div>";if(!d)h+='<p class="hint">اختار True أو False. اضغط على أي كلمة في العبارة لترجمتها قبل ما تجاوب.</p>';else{const ok=S.pick===q.a;h+='<div class="res '+(ok?"ok":"no")+'">'+(ok?"إجابتك صح ✓":'إجابتك غلط ✗ — الإجابة الصح: <bdi dir="ltr">'+(q.a==="true"?"True":"False")+"</bdi>")+'</div><div class="tr"><b>ترجمة العبارة:</b><br>'+AR(q.t)+'</div><div class="ans"><div class="en">'+W(q.e)+"</div><div>"+AR(q.te)+'</div></div><div class="acts nx"><button class="btn" data-act="next">التالي</button></div>';}app.innerHTML=h+"</div>";}
function essay(){const A=S.q,L=A.length;if(S.i>=L)return endScreen(L,"المقالي",true);const q=A[S.i];let h=head(L,"المقالي"+(q.x?" · إضافي":""))+'<div class="card"><span class="tag">'+q.tag+" "+(S.i+1)+'</span><div class="en">'+W(q.q)+"</div>";if(S.tq)h+='<div class="tr"><b>ترجمة السؤال:</b><br>'+AR(q.tq)+"</div>";if(S.st===0){h+='<div class="acts nx">'+(S.tq?"":'<button class="btn alt" data-act="tq">ترجمة السؤال</button>')+'<button class="btn" data-act="showa">اعرض الإجابة</button></div>';}else{h+='<div class="ans"><b>الإجابة:</b><div class="en">'+W(q.a)+"</div>"+(S.ta?'<div class="tr"><b>ترجمة الإجابة:</b><br>'+AR(q.ta)+"</div>":"")+'</div><div class="acts nx">'+(S.ta?"":'<button class="btn alt" data-act="ta">ترجمة الإجابة</button>')+'<button class="btn" data-act="next">السؤال التالي</button></div>';}app.innerHTML=h+"</div>";}
const R={mcq,tf,essay};
function go(m){S={m,i:0,sc:0,done:false,st:0,tq:false,ta:false,pick:-1,more:false,q:shuf(POOL[m].filter(x=>!x.x))};R[m]();window.scrollTo(0,0);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-act],[data-pick],[data-tf]");if(!b)return;if(b.dataset.pick!==undefined&&e.target.closest(".w"))return;if(b.dataset.go)return go(b.dataset.go);if(b.dataset.pick!==undefined){if(S.done)return;S.pick=+b.dataset.pick;S.done=true;if(S.pick===S.q[S.i].a)S.sc++;return mcq();}if(b.dataset.tf){if(S.done)return;S.pick=b.dataset.tf;S.done=true;if(S.pick===S.q[S.i].a)S.sc++;return tf();}const a=b.dataset.act;if(a==="home")return home();if(a==="restart")return go(S.m);if(a==="more"){S.q=S.q.concat(shuf(POOL[S.m].filter(x=>x.x)));S.more=true;S.done=false;S.st=0;S.tq=false;S.ta=false;S.pick=-1;R[S.m]();window.scrollTo(0,0);return;}if(a==="tq"){S.tq=true;return essay();}if(a==="showa"){S.st=1;return essay();}if(a==="ta"){S.ta=true;return essay();}if(a==="next"){S.i++;S.done=false;S.st=0;S.tq=false;S.ta=false;S.pick=-1;R[S.m]();window.scrollTo(0,0);}});
home();
</script>
